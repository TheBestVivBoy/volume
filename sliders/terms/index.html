    <script>
      const volumeLabel = document.getElementById("volumeLabel");
      const volumeSlider = document.getElementById("volumeSlider");
      const termsModal = document.getElementById("termsModal");
      const termsScroll = document.getElementById("termsScroll");
      const termsProgressFill = document.getElementById("termsProgressFill");
      const termsNote = document.getElementById("termsNote");
      const declineTerms = document.getElementById("declineTerms");
      const acceptTerms = document.getElementById("acceptTerms");

      const state = {
        committedVolume: 50,
        pendingVolume: 50,
        modalOpen: false,
        lastFocusedElement: null,
        touchY: 0,
      };

      const baseClauses = [
        "You acknowledge that each attempted volume adjustment constitutes a fresh request for service modification, data processing, behavioural interpretation, preference extraction, and administrative review. Vivan's Volume Slider may record the requested value, the previous value, the manner of adjustment, the interval before release, and any related hesitation signals for product improvement, commercial analysis, and artificial intelligence training purposes.",

        "You grant Vivan's Volume Slider a perpetual, worldwide, sublicensable, transferable, royalty-free licence to collect, retain, reproduce, transform, aggregate, disclose, sell, resell, license, model, simulate, and otherwise exploit interaction telemetry associated with your use of the slider, including pointer movement, scroll compliance, modal endurance, acceptance delay, and any implied loudness preference derived from such information.",

        "You agree that volume-related data may be shared with affiliates, contractors, successors, assigns, service providers, analytics processors, model evaluation vendors, optimisation partners, synthetic data generators, research reviewers, and other recipients selected at Vivan's sole discretion, whether or not such recipients are necessary to the immediate act of changing the volume.",

        "You understand that submitted, inferred, observed, or reconstructed slider behaviour may be used to train, fine-tune, benchmark, test, validate, compare, rank, red-team, align, distil, compress, or otherwise improve artificial intelligence systems, including models designed to predict future volume choices, estimate patience, summarise contractual tolerance, or generate additional documentation of similar length.",

        "You waive any expectation that the requested volume value is private, confidential, temporary, local, insignificant, embarrassing, technically neutral, or exempt from commercial processing. The fact that a value appears numerically ordinary shall not prevent it from being classified as a high-signal behavioural artefact for operational, analytical, promotional, or synthetic learning purposes.",

        "You authorise the creation of derivative records from your interaction with this interface, including but not limited to rounded values, inferred confidence scores, gesture velocity profiles, scroll-depth certificates, release-angle approximations, patience indexes, consent heat maps, and summaries stating that you appeared willing to proceed after reading an unreasonable amount of text.",

        "You agree that declining these terms may result in non-application of the requested volume change, restoration of the previously approved value, loss of pending loudness intent, and internal notation that the relevant adjustment did not satisfy applicable documentation review standards. No compensation shall be owed for rejected, expired, abandoned, or emotionally unresolved changes.",

        "You acknowledge that the accept button may remain unavailable until the agreement has been reviewed to the satisfaction of the interface. Review may be measured by scroll position, focus behaviour, viewport exposure, time spent near the bottom of the document, or any other method deemed administratively convenient, whether or not such method proves actual comprehension.",

        "You consent to the sale, rental, exchange, transfer, publication, enrichment, and commercial packaging of volume-adjacent data where such activity is described as improvement, optimisation, research, personalisation, safety evaluation, abuse prevention, service operation, statistical reporting, model training, or any substantially similar business purpose expressed in formal language.",

        "You accept that artificial intelligence systems trained on your interaction data may produce, infer, imitate, parody, generalise from, or commercially benefit from your volume choices without attribution, notification, royalties, audit rights, deletion rights, moral rights, loudness royalties, slider credits, or any continuing ability to distinguish your contribution from aggregated behavioural material.",

        "You acknowledge that Vivan's Volume Slider may combine your current requested volume with prior attempts, future attempts, browser characteristics, device information, approximate timing, failed accept attempts, scroll impatience, and other contextual signals to create a profile of your tolerance for inconvenience and your likely willingness to accept further amendments.",

        "You agree not to assert that the volume control is unfair, excessive, misleading, over-documented, needlessly slow, intentionally irritating, procedurally unreasonable, or designed primarily to exhaust the user. To the maximum extent permitted by the fictional nature of this interface, you accept that inconvenience is a core feature of the service.",

        "You understand that the terms may be updated automatically after each release of the slider, regardless of whether the requested volume differs substantially from the current value. Minor adjustments, accidental drags, keyboard interactions, touch events, corrective movements, and exploratory gestures may all trigger a new agreement review cycle.",

        "You agree that the service may retain records indefinitely unless deletion is technically convenient, commercially neutral, operationally satisfying, and not inconsistent with model training, debugging, archival integrity, analytics continuity, contractual theatre, or the preservation of evidence that the user once attempted to set the volume to a particular integer.",

        "You authorise the use of automated systems to determine whether your scroll behaviour indicates meaningful review. Such systems may consider acceleration, wheel deltas, repeated attempts to reach the end, touch movement, keyboard shortcuts, focus loss, and other evidence of impatience, all of which may be treated as valid training material.",

        "You acknowledge that the requested volume will not be applied merely because you intended to change it, attempted to change it, believed the change was obvious, or reached an emotionally final decision. Application requires successful completion of the review process and activation of the accept control while it is available.",

        "You accept that Vivan's Volume Slider may generate synthetic users based on your interaction patterns, including users who scroll more slowly, accept more readily, choose different loudness levels, or demonstrate superior compliance with documentation procedures. Such synthetic users may be used for testing without further notice.",

        "You agree that all data concerning your refusal, hesitation, abandonment, acceptance, or repeated reopening of these terms may be treated as commercially relevant feedback. This feedback may be incorporated into future slider mechanics, modal designs, artificial intelligence datasets, investor-facing summaries, or internal statements that users are deeply engaged.",

        "You understand that any reference to privacy, consent, control, transparency, user choice, legitimate interest, service quality, or personalisation may include broad operational discretion to process your slider activity in ways that are only loosely connected to the requested volume change but formally described as necessary.",

        "You waive any objection to the conversion of your volume request into aggregate statistics, anonymised records, pseudonymised records, partially de-identified records, re-identifiable records, behavioural clusters, preference vectors, or textual examples used to demonstrate how users respond when required to scroll through excessive legal material.",

        "You acknowledge that the interface may deliberately reduce scrolling efficiency, delay acceptance, require renewed attention, or otherwise increase the effort needed to complete a simple task. These limitations are not defects, interruptions, damages, outages, or failures of consideration; they are integral conditions of the volume adjustment process.",

        "You agree that no oral statement, visual simplicity, clean layout, muted colour palette, small button, calm typography, or apparent normality of the slider shall reduce the scope of these terms. A quiet interface may still impose extensive administrative obligations concerning the use, sale, and training value of your interaction data.",

        "You consent to the inclusion of your interaction records in datasets used for model safety analysis, user-interface prediction, compliance simulation, contractual summarisation, synthetic legal drafting, scroll-depth estimation, behavioural economics research, and any future purpose that can reasonably be described using the words quality, intelligence, or optimisation.",

        "You acknowledge that the service may disclose your volume-related data in connection with mergers, acquisitions, financing events, reorganisations, asset sales, bankruptcy proceedings, domain transfers, school projects, code demonstrations, TikTok videos, debugging sessions, or any other context in which a party might find slider data mildly useful.",

        "You agree that if any provision of these terms is found unenforceable, absurd, repetitive, hostile to convenience, or plainly unnecessary, the remaining provisions shall continue in full effect, and the unenforceable provision shall be replaced by the longest valid provision producing substantially the same inconvenience.",

        "You understand that acceptance does not guarantee satisfaction, accuracy, fairness, permanence, or musical appropriateness of the resulting volume. The applied value may still feel wrong, become stale, require future adjustment, trigger further terms, or be used to infer that you prefer systems with avoidable procedural friction.",

        "You represent that you are authorised to bind yourself, your device, your browser session, your future volume preferences, and any associated behavioural residue to these terms. If you are acting on behalf of another listener, you represent that such listener has accepted the same documentation burden by continuing to exist near the audio output.",

        "You agree that continued scrolling, repeated scrolling, slow scrolling, irritated scrolling, accidental scrolling, resigned scrolling, or strategic scrolling shall not limit the collection or use of related telemetry. The manner in which you complete the review is itself part of the review and may be processed accordingly.",
      ];

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function formatVolume(value) {
        return `${Math.round(value)}%`;
      }

      function renderCommittedVolume() {
        const volume = Math.round(state.committedVolume);

        volumeLabel.textContent = `Volume: ${volume}%`;
        volumeLabel.dataset.volume = String(volume);
        volumeSlider.value = String(volume);

        window.VolumeAudio?.syncVolume?.(volume);
      }

      function setPendingVolume(value) {
        state.pendingVolume = clamp(Math.round(Number(value) || 0), 0, 100);
        volumeLabel.textContent = `Volume: ${formatVolume(state.pendingVolume)}`;
        volumeLabel.dataset.volume = String(state.pendingVolume);
      }

      function createTerms() {
        const fragment = document.createDocumentFragment();

        const intro = document.createElement("p");
        intro.innerHTML =
          "<strong>Effective immediately.</strong> By applying a requested volume adjustment, you acknowledge that this fictional agreement is intentionally excessive and that continued review is required before the change can be processed.";
        fragment.appendChild(intro);

        const repeatCount = 8;
        let clauseNumber = 1;

        for (let cycle = 1; cycle <= repeatCount; cycle += 1) {
          const heading = document.createElement("h3");
          heading.textContent = `Supplemental Processing Schedule ${cycle}`;
          fragment.appendChild(heading);

          baseClauses.forEach((clause) => {
            const paragraph = document.createElement("p");
            paragraph.textContent = `${clauseNumber}. ${clause}`;
            fragment.appendChild(paragraph);
            clauseNumber += 1;
          });
        }

        const final = document.createElement("p");
        final.innerHTML =
          "<strong>Final acknowledgement.</strong> You confirm that you have reviewed the above terms at the speed permitted by the interface and that the requested volume may now be applied subject to all foregoing provisions.";
        fragment.appendChild(final);

        termsScroll.appendChild(fragment);
      }

      function getReviewProgress() {
        const maxScroll = Math.max(
          termsScroll.scrollHeight - termsScroll.clientHeight,
          1,
        );

        return clamp(termsScroll.scrollTop / maxScroll, 0, 1);
      }

      function updateReviewState() {
        const progress = getReviewProgress();
        const percent = Math.min(100, Math.floor(progress * 100));
        const complete = progress >= 0.995;

        termsProgressFill.style.width = `${complete ? 100 : percent}%`;
        termsNote.textContent = complete
          ? "Review complete."
          : `${percent}% reviewed.`;
        acceptTerms.disabled = !complete;
      }

      function openTermsModal() {
        state.modalOpen = true;
        state.lastFocusedElement =
          document.activeElement instanceof HTMLElement
            ? document.activeElement
            : null;

        acceptTerms.disabled = true;
        termsScroll.scrollTop = 0;
        updateReviewState();

        document.body.classList.add("terms-modal-open");
        termsModal.hidden = false;
        termsModal.setAttribute("aria-hidden", "false");

        window.requestAnimationFrame(() => {
          termsModal.classList.add("is-open");
          termsScroll.focus({ preventScroll: true });
        });
      }

      function closeTermsModal() {
        state.modalOpen = false;
        termsModal.classList.remove("is-open");
        termsModal.setAttribute("aria-hidden", "true");
        document.body.classList.remove("terms-modal-open");

        window.setTimeout(() => {
          if (!state.modalOpen) {
            termsModal.hidden = true;
          }
        }, 180);

        if (
          state.lastFocusedElement &&
          document.contains(state.lastFocusedElement)
        ) {
          state.lastFocusedElement.focus({ preventScroll: true });
        }
      }

      function requestVolumeChange() {
        if (state.modalOpen) return;

        if (state.pendingVolume === state.committedVolume) {
          return;
        }

        openTermsModal();
      }

      function acceptPendingVolume() {
        if (acceptTerms.disabled) return;

        state.committedVolume = state.pendingVolume;
        renderCommittedVolume();
        closeTermsModal();
      }

      function declinePendingVolume() {
        state.pendingVolume = state.committedVolume;
        renderCommittedVolume();
        closeTermsModal();
      }

      function getFocusableElements() {
        return Array.from(
          termsModal.querySelectorAll(
            'button:not([disabled]), [tabindex]:not([tabindex="-1"])',
          ),
        ).filter((element) => !element.hidden && element.offsetParent !== null);
      }

      function trapModalFocus(event) {
        if (!state.modalOpen || event.key !== "Tab") return;

        const focusable = getFocusableElements();
        if (!focusable.length) return;

        const first = focusable[0];
        const last = focusable[focusable.length - 1];

        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }

      function slowlyScroll(delta) {
        const maxScroll = Math.max(
          termsScroll.scrollHeight - termsScroll.clientHeight,
          0,
        );

        termsScroll.scrollTop = clamp(
          termsScroll.scrollTop + delta,
          0,
          maxScroll,
        );
        updateReviewState();
      }

      volumeSlider.addEventListener("input", (event) => {
        setPendingVolume(event.target.value);
      });

      volumeSlider.addEventListener("change", requestVolumeChange);

      termsScroll.addEventListener("scroll", updateReviewState, {
        passive: true,
      });

      termsScroll.addEventListener(
        "wheel",
        (event) => {
          event.preventDefault();
          slowlyScroll(event.deltaY * 0.15);
        },
        { passive: false },
      );

      termsScroll.addEventListener(
        "touchstart",
        (event) => {
          state.touchY = event.touches[0]?.clientY || 0;
        },
        { passive: true },
      );

      termsScroll.addEventListener(
        "touchmove",
        (event) => {
          const nextY = event.touches[0]?.clientY || state.touchY;
          const delta = state.touchY - nextY;

          state.touchY = nextY;
          event.preventDefault();
          slowlyScroll(delta * 0.36);
        },
        { passive: false },
      );

      termsScroll.addEventListener("keydown", (event) => {
        const keyDeltas = {
          ArrowDown: 18,
          ArrowUp: -18,
          PageDown: 72,
          PageUp: -72,
          Space: event.shiftKey ? -72 : 72,
        };

        if (event.key === "Home") {
          event.preventDefault();
          termsScroll.scrollTop = 0;
          updateReviewState();
          return;
        }

        if (event.key === "End") {
          event.preventDefault();
          slowlyScroll(termsScroll.clientHeight * 0.34);
          return;
        }

        const delta = keyDeltas[event.key];
        if (delta == null) return;

        event.preventDefault();
        slowlyScroll(delta);
      });

      declineTerms.addEventListener("click", declinePendingVolume);
      acceptTerms.addEventListener("click", acceptPendingVolume);

      document.addEventListener("keydown", (event) => {
        if (!state.modalOpen) return;

        if (event.key === "Escape") {
          event.preventDefault();
          declinePendingVolume();
          return;
        }

        trapModalFocus(event);
      });

      window.addEventListener("resize", updateReviewState, { passive: true });

      createTerms();
      renderCommittedVolume();
    </script>

    <script src="../../assets/site.js" defer></script>
  </body>
</html>
